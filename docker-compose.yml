services:
  api:
    build: .
    image: nodegate:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    environment:
      # Refuse to start without a key so the container is never exposed unauthenticated.
      API_KEY: ${API_KEY:?Set API_KEY in .env (see .env.example)}
    volumes:
      - nodegate-data:/app/data

volumes:
  nodegate-data:
